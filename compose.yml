services:
  customer-db:
    image: postgres:17-alpine
    command: ["postgres","-c","wal_level=logical"]
    environment: {POSTGRES_DB: customers, POSTGRES_USER: platform, POSTGRES_PASSWORD: platform}
    ports: ["5433:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U platform -d customers"], interval: 5s, timeout: 3s, retries: 20}
    volumes: [customer-data:/var/lib/postgresql/data]
  analytics-db:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: analytics, POSTGRES_USER: platform, POSTGRES_PASSWORD: platform}
    ports: ["5434:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U platform -d analytics"], interval: 5s, timeout: 3s, retries: 20}
    volumes: [analytics-data:/var/lib/postgresql/data]
  airflow-db:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: airflow, POSTGRES_USER: airflow, POSTGRES_PASSWORD: airflow}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"], interval: 5s, timeout: 3s, retries: 20}
    volumes: [airflow-data:/var/lib/postgresql/data]
  invoice-db:
    image: postgres:17-alpine
    command: ["postgres","-c","wal_level=logical"]
    environment: {POSTGRES_DB: invoices, POSTGRES_USER: platform, POSTGRES_PASSWORD: platform}
    ports: ["5435:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U platform -d invoices"], interval: 5s, timeout: 3s, retries: 20}
    volumes: [invoice-data:/var/lib/postgresql/data]
  payment-db:
    image: postgres:17-alpine
    command: ["postgres","-c","wal_level=logical"]
    environment: {POSTGRES_DB: payments, POSTGRES_USER: platform, POSTGRES_PASSWORD: platform}
    ports: ["5436:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U platform -d payments"], interval: 5s, timeout: 3s, retries: 20}
    volumes: [payment-data:/var/lib/postgresql/data]
  identity-db:
    image: postgres:17-alpine
    command: ["postgres","-c","wal_level=logical"]
    environment: {POSTGRES_DB: identities, POSTGRES_USER: platform, POSTGRES_PASSWORD: platform}
    ports: ["5437:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U platform -d identities"], interval: 5s, timeout: 3s, retries: 20}
    volumes: [identity-data:/var/lib/postgresql/data]
  invoice-adjustment-db:
    image: postgres:17-alpine
    command: ["postgres","-c","wal_level=logical"]
    environment: {POSTGRES_DB: invoice_adjustments, POSTGRES_USER: platform, POSTGRES_PASSWORD: platform}
    ports: ["5438:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U platform -d invoice_adjustments"], interval: 5s, timeout: 3s, retries: 20}
    volumes: [invoice-adjustment-data:/var/lib/postgresql/data]
  kafka:
    image: apache/kafka:4.1.0
    ports: ["9092:9092"]
    environment: {KAFKA_NODE_ID: 1, KAFKA_PROCESS_ROLES: "broker,controller", KAFKA_LISTENERS: "PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092", KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092", KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER, KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT", KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093", KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1}
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    command: ["--kafka.server=kafka:29092"]
    depends_on: [kafka]
    ports: ["9308:9308"]
  prometheus:
    image: prom/prometheus:v3.13.2
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: ["./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]
  connect:
    image: quay.io/debezium/connect:3.4
    depends_on: [kafka, customer-db, invoice-db, invoice-adjustment-db, payment-db, identity-db]
    ports: ["8083:8083"]
    environment: {BOOTSTRAP_SERVERS: kafka:29092, GROUP_ID: "1", CONFIG_STORAGE_TOPIC: connect_configs, OFFSET_STORAGE_TOPIC: connect_offsets, STATUS_STORAGE_TOPIC: connect_statuses}
  customer-service:
    build: {context: ., args: {MODULE: customer-service}}
    depends_on: {customer-db: {condition: service_healthy}}
    environment: {CUSTOMER_DB_URL: jdbc:postgresql://customer-db:5432/customers}
    ports: ["8081:8081"]
  invoice-service:
    build: {context: ., args: {MODULE: invoice-service}}
    depends_on: {invoice-db: {condition: service_healthy}}
    environment: {INVOICE_DB_URL: jdbc:postgresql://invoice-db:5432/invoices}
    ports: ["8084:8084"]
  invoice-adjustment-service:
    build: {context: ., args: {MODULE: invoice-adjustment-service}}
    depends_on: {invoice-adjustment-db: {condition: service_healthy}}
    environment: {INVOICE_ADJUSTMENT_DB_URL: jdbc:postgresql://invoice-adjustment-db:5432/invoice_adjustments}
    ports: ["8087:8087"]
  payment-service:
    build: {context: ., args: {MODULE: payment-service}}
    depends_on: {payment-db: {condition: service_healthy}}
    environment: {PAYMENT_DB_URL: jdbc:postgresql://payment-db:5432/payments}
    ports: ["8085:8085"]
  identity-service:
    build: {context: ., args: {MODULE: identity-service}}
    depends_on: {identity-db: {condition: service_healthy}}
    environment: {IDENTITY_DB_URL: jdbc:postgresql://identity-db:5432/identities}
    ports: ["8086:8086"]
  analytics-service:
    build: {context: ., args: {MODULE: analytics-service}}
    depends_on: {analytics-db: {condition: service_healthy}, kafka: {condition: service_started}}
    environment: {ANALYTICS_DB_URL: jdbc:postgresql://analytics-db:5432/analytics, KAFKA_BOOTSTRAP_SERVERS: kafka:29092}
    ports: ["8082:8082"]
  semantic-query-service:
    build: {context: ., args: {MODULE: semantic-query-service}}
    depends_on: {analytics-db: {condition: service_healthy}}
    environment: {SEMANTIC_DB_URL: jdbc:postgresql://analytics-db:5432/analytics}
    ports: ["8088:8088"]
  analytics-portal:
    build: {context: apps/analytics-portal}
    depends_on: [semantic-query-service]
    ports: ["8090:80"]
  data-generator:
    profiles: [tools]
    build: {context: ., args: {MODULE: data-generator}}
    depends_on: [customer-service, invoice-service, invoice-adjustment-service, payment-service, identity-service]
    environment: {CUSTOMER_SERVICE_URL: "http://customer-service:8081", INVOICE_SERVICE_URL: "http://invoice-service:8084", INVOICE_ADJUSTMENT_SERVICE_URL: "http://invoice-adjustment-service:8087", PAYMENT_SERVICE_URL: "http://payment-service:8085", IDENTITY_SERVICE_URL: "http://identity-service:8086", EVENT_COUNT: "100"}
  grafana:
    image: grafana/grafana:12.3.0
    depends_on: {analytics-db: {condition: service_healthy}}
    ports: ["3000:3000"]
    environment: {GF_SECURITY_ADMIN_USER: admin, GF_SECURITY_ADMIN_PASSWORD: admin}
    volumes:
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
  airflow:
    build: {context: infrastructure/airflow}
    command: standalone
    depends_on:
      airflow-db: {condition: service_healthy}
      analytics-service: {condition: service_started}
      connect: {condition: service_started}
    ports: ["8080:8080"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      ANALYTICS_DATABASE_URL: postgresql://platform:platform@analytics-db:5432/analytics
      KAFKA_CONNECT_URL: http://connect:8083
    volumes:
      - ./infrastructure/airflow/dags:/opt/airflow/dags:ro
      - ./infrastructure/airflow/profiles.yml:/opt/airflow/dbt-profile/profiles.yml:ro
      - ./:/opt/platform:ro
volumes: {customer-data: {}, invoice-data: {}, invoice-adjustment-data: {}, payment-data: {}, identity-data: {}, analytics-data: {}, airflow-data: {}}
